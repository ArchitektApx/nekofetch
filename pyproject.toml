[project]
name = "nekofetch"
version = "1.0.0"
description = "fastfetch, but with catgirls."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/nekofetch/data/images/LICENSE"]
authors = [{ name = "ArchitektApx" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["fastfetch", "neofetch", "terminal", "catgirl", "neko"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.optional-dependencies]
uwu = ["uwuipy>=1.0"]

[project.urls]
Homepage = "https://github.com/ArchitektApx/nekofetch"

[project.scripts]
nekofetch = "nekofetch.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff==0.17.2", "pyright>=1.1.400"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nekofetch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",        # docstrings where they help, not on every function
    "COM812",   # trailing commas: left to the formatter
    "T201",     # print: it's a CLI
    "S603",     # subprocess without shell=True, on fixed argument lists
    "S607",     # tools (git, tmux, chafa) are looked up on PATH on purpose
    "FBT001",   # boolean parameters
    "FBT002",
    "EM101",    # exception messages inline
    "EM102",
    "TRY003",
    "CPY001",   # one LICENSE file, no per-file headers
    "S311",     # random picks cats and lines, not keys
    "PLC0415",  # lazy imports (urllib, sqlite3, plistlib) keep shell startup fast
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108", "PLR2004", "ANN", "INP001", "SLF001"]
# tools/ are one-off scripts for the art and the README images
"tools/*" = ["INP001", "PLR2004", "ANN", "C901", "PLR0912", "PLR0915", "N806", "PTH", "T20", "B008", "E741"]

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.format]
line-ending = "lf"

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.11"
